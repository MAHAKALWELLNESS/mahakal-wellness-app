  .cart-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}

  .total-row .lbl{font-size:13px; color:var(--ink-soft);}
  .total-row .val{font-size:20px; font-weight:700; color:var(--green-800);}
  .btn{display:block; width:100%; padding:14px; border-radius:12px; border:none; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; text-align:center; text-decoration:none;}
  .btn-gold{background:var(--gold-500); color:var(--green-900);}
  .btn-gold:disabled{opacity:.5;}
  .hint{font-size:12.5px; color:var(--ink-faint); margin:0;}
  .error-msg{font-size:12.5px; color:var(--danger); margin:8px 0 0; min-height:16px;}
  .empty{padding:40px 20px; text-align:center; color:var(--ink-faint);}
  .success-icon{width:56px; height:56px; border-radius:50%; background:var(--ok-100); color:var(--ok); font-size:28px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://lrrqdmmugvizkbjfwneb.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_3zfx8Ne9j2cX7-UmwjY4yg_FRE2xxrP';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------------------------------------------------------------------------
  // ONE GUARD FOR EVERY SAVE. If the exact same write (same function, same data) is already
  // on its way to the server, a second tap/click does NOT send a second copy - it waits for,
  // and gets, the first one's answer. This protects every save/update/delete on this page at
  // once (including ones added later), so "tapped twice while it was still saving" can never
  // again record a payment, a delivery or a stock change twice. Read-only lookups
  // (get_/check_/search_...) are left alone.
  (function installRpcGuard_() {
    const readOnly = /^(get|check|search|list|lookup|find|fetch|load|sum|count)_/;
    const rawRpc = sb.rpc.bind(sb);
    const inFlight = new Map();
    sb.rpc = function (name, args, options) {
      if (readOnly.test(String(name))) return rawRpc(name, args, options);
      const key = name + '|' + JSON.stringify(args === undefined ? null : args);
      if (inFlight.has(key)) return inFlight.get(key);
      const request = Promise.resolve(rawRpc(name, args, options)).finally(function () { inFlight.delete(key); });
      inFlight.set(key, request);
      return request;
    };
  })();

  const BUSINESS_UPI_ID = '8199983834@okbizaxis';
  const BUSINESS_PAYEE_NAME = 'Mahakal Wellness';

  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }
  function fmtDateInput_(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function hallRate_(projector, ac) {
    if (ac && projector) return 2500;
    if (ac) return 2200;
    if (projector) return 2000;
    return 1500;
  }

  function renderForm() {
    document.getElementById('mainArea').innerHTML =
      '<div class="card">' +
        '<p class="section-label">Your details</p>' +
        '<div class="field"><label for="hbName">Name</label><input type="text" id="hbName" placeholder="Your name" oninput="this.value=this.value.toUpperCase()"></div>' +
        '<div class="field" style="margin-bottom:0;"><label for="hbMobile">Mobile</label><input type="tel" id="hbMobile" placeholder="10-digit mobile" maxlength="15"></div>' +
      '</div>' +
      '<div class="card">' +
        '<p class="section-label">Hall details</p>' +
        '<p class="hint" style="margin-bottom:10px;">Capacity: 100 people · 1 Projector · 2 AC available</p>' +
        '<div class="field-row">' +
          '<div class="field"><label for="hbDate">Date</label><input type="date" id="hbDate" onchange="checkAvailability_()"></div>' +
          '<div class="field"><label for="hbSlot">Time Slot</label>' +
            '<select id="hbSlot" onchange="checkAvailability_()" style="width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;">' +
              '<option value="Morning (10:00 AM - 2:00 PM)">Morning (10 AM - 2 PM)</option>' +
              '<option value="Evening (2:30 PM - 6:30 PM)">Evening (2:30 - 6:30 PM)</option>' +
            '</select>' +
          '</div>' +
        '</div>' +
        '<p class="hint" id="availabilityHint" style="margin:0 0 14px;"></p>' +
        '<p class="section-label">What do you need?</p>' +
        '<div style="display:flex;gap:24px;margin-bottom:14px;">' +
          '<label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;"><input type="checkbox" id="hbProjector" style="width:auto;" onchange="updateRatePreview_()"> 📽️ Projector</label>' +
          '<label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;"><input type="checkbox" id="hbAc" style="width:auto;" onchange="updateRatePreview_()"> ❄️ AC</label>' +
        '</div>' +
        '<div class="total-row" style="border-top:1.5px solid var(--line);padding-top:12px;margin-bottom:0;"><span class="lbl">Total Hall Charge</span><span class="val" id="ratePreview">₹1500</span></div>' +
      '</div>' +
      '<div class="card">' +
        '<p class="section-label">Advance payment</p>' +
        '<p class="hint" style="margin-bottom:10px;">Submitting this request requires an advance payment. The advance is <strong>non-refundable</strong> and is adjusted against your total hall charge. Your request will then be reviewed and confirmed by our team — the rest of the amount can be paid before or on the day of the event.</p>' +
        '<div class="field-row">' +
          '<div class="field"><label for="hbAdvance">Advance Amount ₹</label><input type="number" id="hbAdvance" min="1" placeholder="e.g. 500"></div>' +
          '<div class="field" style="margin-bottom:0;"><label for="hbMethod">Payment Method</label>' +
            '<select id="hbMethod" style="width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;">' +
              '<option value="Cash">Cash at office</option>' +
              '<option value="Online">Online (UPI)</option>' +
            '</select>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<button class="btn btn-gold" id="submitBookingBtn" onclick="proceedBooking_()">Submit Request</button>' +
      '<p class="error-msg" id="formError"></p>';
    document.getElementById('hbDate').value = fmtDateInput_(new Date());
    checkAvailability_();
  }

  async function checkAvailability_() {
    const date = document.getElementById('hbDate').value;
    const hint = document.getElementById('availabilityHint');
    if (!date) { hint.textContent = ''; return; }
    const { data, error } = await sb.rpc('get_hall_availability', { p_start_date: date, p_end_date: date });
    if (error) return;
    const taken = (data || []).map(function (r) { return r.time_slot; });
    const selectedSlot = document.getElementById('hbSlot').value;
    if (taken.includes(selectedSlot)) {
      hint.textContent = '⚠️ This slot is already booked — please choose another date or slot.';
      hint.style.color = 'var(--danger)';
    } else {
      hint.textContent = '✓ This slot is available.';
      hint.style.color = 'var(--green-800)';
    }
  }

  function updateRatePreview_() {
    const rate = hallRate_(document.getElementById('hbProjector').checked, document.getElementById('hbAc').checked);
    document.getElementById('ratePreview').textContent = money(rate);
  }

  async function proceedBooking_() {
    const errBox = document.getElementById('formError');
    errBox.textContent = '';
    const name = document.getElementById('hbName').value.trim();
    const mobile = document.getElementById('hbMobile').value.trim();
    const date = document.getElementById('hbDate').value;
    const slot = document.getElementById('hbSlot').value;
    const projector = document.getElementById('hbProjector').checked;
    const ac = document.getElementById('hbAc').checked;
    const advance = Number(document.getElementById('hbAdvance').value);
    const method = document.getElementById('hbMethod').value;
    const total = hallRate_(projector, ac);

    if (!name) { errBox.textContent = 'Please enter your name.'; return; }
    if (!mobile || mobile.replace(/\D/g, '').length < 10) { errBox.textContent = 'Please enter a valid 10-digit mobile number.'; return; }
    if (!date) { errBox.textContent = 'Please choose a date.'; return; }
    if (!(advance > 0)) { errBox.textContent = 'Please enter an advance amount.'; return; }
    if (advance > total) { errBox.textContent = 'Advance cannot be more than the total hall charge of ' + money(total) + '.'; return; }

    const draft = { name: name, mobile: mobile, date: date, slot: slot, projector: projector, ac: ac, advance: advance, total: total };
    if (method === 'Cash') { submitHallBooking_(draft, null); return; }
    showHallPaymentQr_(draft);
  }

  function showHallPaymentQr_(draft) {
    const upiUrl = 'upi://pay?pa=' + encodeURIComponent(BUSINESS_UPI_ID) + '&pn=' + encodeURIComponent(BUSINESS_PAYEE_NAME) +
      '&am=' + encodeURIComponent(draft.advance.toFixed(2)) + '&cu=INR&tn=' + encodeURIComponent('Hall booking advance');
    const qrImgUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=' + encodeURIComponent(upiUrl);
    document.getElementById('mainArea').innerHTML =
      '<div class="card" style="text-align:center;">' +
        '<h2 style="font-size:17px;color:var(--green-800);margin-bottom:4px;">Pay advance via UPI</h2>' +
        '<p class="hint">' + money(draft.advance) + '</p>' +
        '<div class="qr-box"><img src="' + qrImgUrl + '" alt="UPI QR code"></div>' +
      '</div>' +
      '<div class="card" style="text-align:center;">' +
        '<a class="btn" style="background:transparent;border:1.5px solid var(--line);color:var(--green-800);" href="' + escapeHtml(upiUrl) + '">Or tap here to open your UPI app</a>' +
      '</div>' +
      '<div class="card">' +
        '<div class="field" style="margin-bottom:0;"><label for="hbUtr">Your UPI transaction ref. (UTR) — required</label><input type="text" id="hbUtr" placeholder="As shown in your UPI app after payment"></div>' +
        '<p class="error-msg" id="utrError"></p>' +
      '</div>' +
      '<button class="btn btn-gold" id="confirmHallPaidBtn" onclick="confirmHallPaid_()">I\'ve completed the payment</button>';
    window.__hallDraft = draft;
  }

  function confirmHallPaid_() {
    const utr = document.getElementById('hbUtr').value.trim();
    if (!utr) { document.getElementById('utrError').textContent = 'Please enter your UPI transaction reference (UTR).'; return; }
    submitHallBooking_(window.__hallDraft, utr);
  }

  async function submitHallBooking_(draft, utr) {
    document.getElementById('mainArea').innerHTML = '<div class="empty">Sending your request…</div>';
    const { data, error } = await sb.rpc('create_hall_booking', {
      p_booking_date: draft.date, p_time_slot: draft.slot, p_customer_name: draft.name, p_mobile: draft.mobile,
      p_needs_projector: draft.projector, p_needs_ac: draft.ac,
      p_advance_amount: draft.advance, p_advance_method: utr ? 'Online' : 'Cash', p_advance_utr: utr
    });
    if (error) {
      document.getElementById('mainArea').innerHTML = '<div class="card"><p class="error-msg" style="display:block;">' + escapeHtml(error.message) + '</p></div>' +
        '<button class="btn btn-gold" onclick="renderForm()">← Try Again</button>';
      return;
    }
    document.getElementById('mainArea').innerHTML =
      '<div class="card" style="text-align:center;">' +
        '<div class="success-icon">✓</div>' +
        '<h2 style="font-size:18px;color:var(--green-800);margin-bottom:4px;">Request Submitted!</h2>' +
        '<p class="hint">' + escapeHtml(draft.date) + ' · ' + escapeHtml(draft.slot) + '</p>' +
        '<p class="hint" style="margin-top:8px;color:var(--gold-600);font-weight:600;">Awaiting confirmation from our team</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="total-row" style="border-top:none;padding-top:0;"><span class="lbl">Total Hall Charge</span><span class="val">' + money(data.totalAmount) + '</span></div>' +
        '<div class="total-row"><span class="lbl">Advance Paid</span><span class="val" style="color:var(--ok);">' + money(draft.advance) + '</span></div>' +
        '<div class="total-row"><span class="lbl">Balance Due</span><span class="val" style="color:var(--danger);">' + money(data.balanceAmount) + '</span></div>' +
      '</div>' +
      '<p class="hint" style="text-align:center;margin-bottom:14px;">This slot is now reserved for you while we review your request. We\'ll confirm your booking on WhatsApp shortly. The balance can be paid before or on the day of the event.</p>' +
      '<button class="btn btn-gold" onclick="renderForm()">← Request Another Slot</button>';
  }

  renderForm();
</script>

<style id="mwUxCss">
  :root{--kb:0px; --vvh:100vh;}
  .modal-overlay,.qty-modal-overlay,#notifPanel,#notifDetailPopup{bottom:var(--kb) !important;}
  .modal-sheet,.qty-modal-sheet{max-height:calc(var(--vvh) * .92) !important;}
  .summary-bar{bottom:var(--kb) !important;}
  .toast{bottom:calc(100px + var(--kb)) !important;}
  html.kb-open body{padding-bottom:calc(var(--kb) + 24px);}
</style>
<script>
/* On-screen keyboard: --kb = how much of the bottom of the screen the keyboard covers, --vvh = the height that is really visible. */
(function () {
  var vv = window.visualViewport, root = document.documentElement;
  function update() {
    var kb = 0, h = window.innerHeight;
    if (vv) { h = vv.height; if (!vv.scale || Math.abs(vv.scale - 1) < 0.02) kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)); }
    if (kb < 60) kb = 0;                                   // the browser's own bars growing or shrinking are not a keyboard
    root.style.setProperty('--kb', kb + 'px'); root.style.setProperty('--vvh', Math.round(h) + 'px'); root.classList.toggle('kb-open', kb > 0);
  }
  if (vv) { vv.addEventListener('resize', update); vv.addEventListener('scroll', update); }
  window.addEventListener('resize', update);
  window.addEventListener('orientationchange', function () { setTimeout(update, 350); });
  update();
  // keep the field being typed in on screen (also when the keyboard takes a moment to open)
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (!t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || /^(checkbox|radio|button|submit|file|range|color)$/i.test(t.type || '')) return;
    [120, 450, 900].forEach(function (ms) {
      setTimeout(function () { if (document.activeElement !== t) return; try { t.scrollIntoView({ block: 'center', behavior: ms === 120 ? 'auto' : 'smooth', inline: 'nearest' }); } catch (x) {} }, ms);
    });
  });
})();
</script>
<script>
/* Popup layers: the popup opened LAST is always the top one. Every popup that is shown takes the next layer number, above every popup shown before it
   (whatever its place in the page), so a popup opened from another popup - Edit customer from the customer window, Transport charges from the bill,
   a confirm window from a list - can never come up UNDER the window it was opened from. Messages (layer 200) and the sign-in screen (300) stay above. */
(function () {
  var SEL = '.modal-overlay, .qty-modal-overlay', BASE = 80, MAX = 190, next = BASE;
  function anyShown() { return !!document.querySelector('.modal-overlay.show, .qty-modal-overlay.show'); }
  function sync(el) {
    var on = el.classList.contains('show');
    if (on && el.getAttribute('data-mwz') === null) {
      if (el.__mwz0 === undefined) el.__mwz0 = el.style.zIndex || '';
      next = Math.min(next + 1, MAX); el.style.zIndex = String(next); el.setAttribute('data-mwz', String(next));
    } else if (!on && el.getAttribute('data-mwz') !== null) {
      el.removeAttribute('data-mwz'); el.style.zIndex = el.__mwz0 || '';
      if (!anyShown()) next = BASE;
    }
  }
  var attrObs = new MutationObserver(function (list) { list.forEach(function (m) { sync(m.target); }); });
  function watch(el) { if (el.__mwWatched) return; el.__mwWatched = true; attrObs.observe(el, { attributes: true, attributeFilter: ['class'] }); sync(el); }
  function scan(root) { if (root.matches && root.matches(SEL)) watch(root); if (root.querySelectorAll) Array.prototype.forEach.call(root.querySelectorAll(SEL), watch); }
  function start() {
    scan(document);
    new MutationObserver(function (list) { list.forEach(function (m) { Array.prototype.forEach.call(m.addedNodes, function (n) { if (n.nodeType === 1) scan(n); }); }); }).observe(document.body, { childList: true, subtree: true });
  }
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>

<script id="mwPhone">
/* every mobile / WhatsApp box: digits only and 10 digits at most (a pasted +91 or 0 in front is dropped) */
(function () {
  function clean(v) { var d = String(v == null ? '' : v).replace(/\D/g, ''); if (d.length === 12 && d.slice(0, 2) === '91') d = d.slice(2); else if (d.length === 11 && d.charAt(0) === '0') d = d.slice(1); return d.slice(0, 10); }
  window.phoneClean_ = clean;
  document.addEventListener('input', function (e) { var el = e.target; if (el && el.tagName === 'INPUT' && (el.type === 'tel' || el.hasAttribute('data-phone'))) { var c = clean(el.value); if (c !== el.value) el.value = c; } }, true);
  function mark() { Array.prototype.forEach.call(document.querySelectorAll('input[type=tel]'), function (el) { el.setAttribute('inputmode', 'numeric'); }); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mark); else mark();
})();
</script>
