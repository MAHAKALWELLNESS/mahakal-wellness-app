<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Place an Order — Mahakal Wellness</title>
<link rel="manifest" href="manifest-order.json">
<meta name="theme-color" content="#132E26">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MW Order">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --green-900:#132E26; --green-800:#1E4A3D; --green-700:#2A5C4C; --green-100:#DCE9E3;
    --gold-500:#D9A441; --gold-600:#B8842C; --gold-100:#F7E9C7;
    --surface:#FFFFFF; --bg:#F6F5F1; --ink-soft:#555; --ink-faint:#8A8A8A; --line:#E7E4DC;
    --danger:#C0392B; --danger-100:#FBE7E4; --ok:#2E7D4F; --ok-100:#E3F1E8;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:#222; -webkit-font-smoothing:antialiased;}
  h1,h2{font-family:'Fraunces',serif; margin:0;}
  .topbar{background:var(--green-900); padding:14px 16px; text-align:center;}
  .topbar h1{font-size:17px; font-weight:600; color:#fff;}
  .topbar p{margin:2px 0 0; font-size:11.5px; color:var(--green-100); opacity:.85;}
  main{max-width:520px; margin:0 auto; padding:16px 16px 90px;}
  .card{background:var(--surface); border-radius:16px; padding:20px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .section-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-faint); margin:0 0 10px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input{width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; font-family:inherit; background:#fff;}
  .field input:focus{outline:none; border-color:var(--gold-500);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .search-wrap{position:relative;}
  .search-results{margin-top:8px; max-height:280px; overflow-y:auto;}
  .search-row{display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
  .search-row:last-child{border-bottom:none;}
  .search-row:active{background:var(--bg);}
  .search-name{font-size:13.5px; font-weight:600;}
  .search-meta{font-size:11.5px; color:var(--ink-faint);}
  .search-price{font-size:13.5px; font-weight:700; color:var(--green-800); white-space:nowrap; margin-left:10px;}
  .cart-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}
  .cart-row:last-child{border-bottom:none;}
  .cart-name{font-size:13.5px; font-weight:600;}
  .cart-price{font-size:11.5px; color:var(--ink-faint);}
  .qty-ctrl{display:flex; align-items:center; gap:10px;}
  .qty-btn{width:30px; height:30px; border-radius:8px; border:1.5px solid var(--line); background:#fff; font-size:16px; font-weight:700; color:var(--green-800); cursor:pointer;}
  .qty-val{min-width:22px; text-align:center; font-weight:700; font-size:14px;}
  .empty-cart{padding:24px 0; text-align:center; color:var(--ink-faint); font-size:13px;}
  .total-row{display:flex; justify-content:space-between; align-items:center; padding-top:12px; margin-top:4px; border-top:1px solid var(--line);}
  .total-row .lbl{font-size:13px; color:var(--ink-soft);}
  .total-row .val{font-size:20px; font-weight:700; color:var(--green-800);}
  .btn{display:block; width:100%; padding:14px; border-radius:12px; border:none; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; text-align:center; text-decoration:none;}
  .btn-gold{background:var(--gold-500); color:var(--green-900);}
  .btn-gold:disabled{opacity:.5;}
  .hint{font-size:12.5px; color:var(--ink-faint); margin:0;}
  .error-msg{font-size:12.5px; color:var(--danger); margin:8px 0 0; min-height:16px;}
  .empty{padding:40px 20px; text-align:center; color:var(--ink-faint);}
  .success-icon{width:56px; height:56px; border-radius:50%; background:var(--ok-100); color:var(--ok); font-size:28px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
  .qr-box{text-align:center; padding:18px 0 6px;}
  .qr-box img{width:220px; height:220px; border-radius:12px; border:1px solid var(--line);}
  .search-row.kbd-active{background:var(--bg);}
  .btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--green-800);}
  .qty-modal-overlay{display:none; position:fixed; inset:0; background:rgba(19,46,38,.45); z-index:70; align-items:flex-end; justify-content:center;}
  .qty-modal-overlay.show{display:flex;}
  .qty-modal-sheet{background:var(--surface); width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:20px 20px 24px;}
  .qty-modal-sheet h2{font-size:16px; color:var(--green-800);}
  .qty-modal-actions{display:flex; gap:10px;}
  .qty-modal-actions .btn{flex:1;}
</style>
</head>
<body>
  <header class="topbar" style="position:relative;">
    <button id="notifBellBtn" onclick="openNotifPanel_()" style="position:absolute;top:12px;right:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;">🔔</button>
    <a href="index.html" style="display:inline-block;margin-bottom:8px;color:var(--green-100);font-size:12px;font-weight:600;text-decoration:none;opacity:.9;">← Back to Main Page</a>
    <h1>Mahakal Wellness</h1>
    <p>Place an Order</p>
    <button onclick="refreshOrderForm()" style="margin-top:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;">↻ Refresh</button>
  </header>

  <div class="modal-overlay-notif" id="notifPanel" style="display:none;position:fixed;inset:0;background:rgba(19,46,38,.45);z-index:60;align-items:flex-end;justify-content:center;">
    <div style="background:var(--surface);width:100%;max-width:520px;max-height:80vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="font-size:16px;color:var(--green-800);margin:0;">Notifications</h2>
        <button onclick="closeNotifPanel_()" style="background:var(--bg);border:1.5px solid var(--line);border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;color:var(--ink-soft);">✕</button>
      </div>
      <div id="notifEnableRow" style="display:none;margin-bottom:14px;">
        <button class="btn btn-gold btn-block" onclick="enablePushNotifications_()">🔔 Enable Notifications</button>
        <p class="hint" id="notifPanelMsg" style="margin-top:6px;"></p>
      </div>
      <div id="notifList"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <!-- Quantity popup: opens as soon as a product is chosen (same flow as New Bill) -->
  <div class="qty-modal-overlay" id="orderQtyModal">
    <div class="qty-modal-sheet">
      <h2 id="oqtyName" style="margin-bottom:2px;"></h2>
      <p class="hint" id="oqtyMeta" style="margin-bottom:14px;"></p>
      <div class="field" style="margin-bottom:16px;">
        <label for="oqtyInput">Quantity</label>
        <input type="number" id="oqtyInput" min="1" step="1" inputmode="numeric" placeholder="Enter qty" onkeydown="orderQtyKeydown(event)">
      </div>
      <div class="qty-modal-actions">
        <button class="btn btn-outline" type="button" onclick="cancelOrderQtyModal()">Cancel</button>
        <button class="btn btn-gold" type="button" onclick="confirmOrderQtyModal()">Add</button>
      </div>
    </div>
  </div>

  <div style="max-width:520px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;">
    <button id="tabBtnOrder" onclick="switchOrderFormTab('order')" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--green-800);background:var(--green-800);color:#fff;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;">Place Order</button>
    <button id="tabBtnTrack" onclick="switchOrderFormTab('track')" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;">Track My Bills</button>
  </div>
  <main id="mainArea">
    <div class="empty">Loading…</div>
  </main>
  <main id="trackArea" style="display:none;">
  </main>

<script>
  const SUPABASE_URL = 'https://lrrqdmmugvizkbjfwneb.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_3zfx8Ne9j2cX7-UmwjY4yg_FRE2xxrP';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------------------------------------------------------------------------
  // ONE GUARD FOR EVERY SAVE. If the exact same write (same function, same data) is already
  // on its way to the server, a second tap/click does NOT send a second copy - it waits for,
  // and gets, the first one's answer. This protects every save/update/delete on this page at
  // once (including ones added later), so "tapped twice while it was still saving" can never
  // again record a payment, a delivery or a stock change twice. Read-only lookups
  // (get_/check_/search_...) are left alone.
  (function installRpcGuard_() {
    const readOnly = /^(get|check|search|list|lookup|find|fetch|load|sum|count)_/;
    const rawRpc = sb.rpc.bind(sb);
    const inFlight = new Map();
    sb.rpc = function (name, args, options) {
      if (readOnly.test(String(name))) return rawRpc(name, args, options);
      const key = name + '|' + JSON.stringify(args === undefined ? null : args);
      if (inFlight.has(key)) return inFlight.get(key);
      const request = Promise.resolve(rawRpc(name, args, options)).finally(function () { inFlight.delete(key); });
      inFlight.set(key, request);
      return request;
    };
  })();


  // ⚠️ REPLACE THIS with the business's real UPI ID (VPA) once you have it -
  // e.g. 'mahakalwellness@okaxis'. Without a real one here, the QR code on
  // the confirmation screen won't work for actual payment.
  const BUSINESS_UPI_ID = '8199983834@okbizaxis';
  const BUSINESS_PAYEE_NAME = 'Mahakal Wellness';

  let ALL_PRODUCTS = [];
  let CART = {}; // code -> { code, name, mrp, qty }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) { return '₹' + (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
  function trimNum(n) { n = Number(n) || 0; return n % 1 === 0 ? String(n) : n.toFixed(2).replace(/\.?0+$/, ''); }

  function switchOrderFormTab(tab) {
    const orderBtn = document.getElementById('tabBtnOrder');
    const trackBtn = document.getElementById('tabBtnTrack');
    document.getElementById('mainArea').style.display = tab === 'order' ? 'block' : 'none';
    document.getElementById('trackArea').style.display = tab === 'track' ? 'block' : 'none';
    orderBtn.style.background = tab === 'order' ? 'var(--green-800)' : '#fff';
    orderBtn.style.color = tab === 'order' ? '#fff' : 'var(--ink-soft)';
    orderBtn.style.borderColor = tab === 'order' ? 'var(--green-800)' : 'var(--line)';
    trackBtn.style.background = tab === 'track' ? 'var(--green-800)' : '#fff';
    trackBtn.style.color = tab === 'track' ? '#fff' : 'var(--ink-soft)';
    trackBtn.style.borderColor = tab === 'track' ? 'var(--green-800)' : 'var(--line)';
    if (tab === 'track' && !document.getElementById('trackMobileInput')) renderTrackForm();
  }

  function renderTrackForm() {
    document.getElementById('trackArea').innerHTML =
      '<div class="card">' +
        '<p class="section-label">Find your bills</p>' +
        '<div class="field"><label for="trackMobileInput">Mobile number</label><input type="tel" id="trackMobileInput" placeholder="10-digit mobile" maxlength="15" onkeydown="if(event.key===\'Enter\'){event.preventDefault();searchMyBills();}"></div>' +
        '<div class="field" style="margin-bottom:0;"><label for="trackInvoiceInput">Bill No. (optional — narrows to one bill)</label><input type="text" id="trackInvoiceInput" placeholder="e.g. MW000060" onkeydown="if(event.key===\'Enter\'){event.preventDefault();searchMyBills();}"></div>' +
      '</div>' +
      '<button class="btn btn-gold" onclick="searchMyBills()">Search</button>' +
      '<p class="error-msg" id="trackError"></p>' +
      '<div id="trackResults" style="margin-top:14px;"></div>';
  }

  async function searchMyBills() {
    const errBox = document.getElementById('trackError');
    errBox.textContent = '';
    const mobile = document.getElementById('trackMobileInput').value.trim();
    const invoiceNo = document.getElementById('trackInvoiceInput').value.trim().toUpperCase();
    if (!mobile || mobile.replace(/\D/g, '').length < 10) { errBox.textContent = 'Enter a valid 10-digit mobile number.'; return; }
    const resultsBox = document.getElementById('trackResults');
    resultsBox.innerHTML = '<div class="empty">Searching…</div>';
    const { data, error } = await sb.rpc('get_bills_by_mobile', { p_mobile: mobile, p_invoice_no: invoiceNo || null });
    if (error) { resultsBox.innerHTML = ''; errBox.textContent = 'Could not search right now — try again.'; return; }
    if (!data || !data.length) { resultsBox.innerHTML = '<div class="empty">No bills found for that mobile number' + (invoiceNo ? ' and bill number' : '') + '.</div>'; return; }
    resultsBox.innerHTML = data.map(function (b) {
      const dateStr = new Date(b.date).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
      const isPending = b.billStatus === 'Pending';
      const balanceText = isPending ? '' : (b.balance < -0.005 ? 'Due ' + money(-b.balance) : 'Settled');
      const balanceColor = b.balance < -0.005 ? 'var(--danger)' : 'var(--ok)';
      return '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">' +
          '<div><div style="font-weight:700;color:var(--green-800);">' + escapeHtml(b.invoiceNo) + '</div><div class="hint">' + dateStr + '</div></div>' +
          '<div style="font-weight:700;font-size:15px;">' + money(b.totalAmount) + '</div>' +
        '</div>' +
        '<div class="hint">' + trimNum(b.totalQty) + ' item(s) · ' + trimNum(b.totalSp) + ' SP · ' + escapeHtml(b.customerType) + '</div>' +
        '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">' +
          '<span class="hint" style="font-weight:700;color:' + (isPending ? 'var(--gold-600)' : 'var(--ok)') + ';">' + (isPending ? 'Awaiting Approval' : 'Confirmed') + '</span>' +
          (isPending ? '' : '<span class="hint">·</span><span class="hint">Delivery: ' + escapeHtml(b.deliveryStatus || '') + '</span>') +
          (balanceText ? '<span class="hint">·</span><span class="hint" style="font-weight:700;color:' + balanceColor + ';">' + balanceText + '</span>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }


  async function init() {
    const { data, error } = await sb.rpc('get_public_products_for_order');
    if (error) {
      document.getElementById('mainArea').innerHTML = '<div class="empty">Could not load products. Please try again in a moment.</div>';
      return;
    }
    ALL_PRODUCTS = data || [];
    renderForm();
  }

  async function refreshOrderForm() {
    CART = {};
    document.getElementById('mainArea').innerHTML = '<div class="empty">Refreshing…</div>';
    await init();
  }

  // ---------------- Mobile-first auto-fill for returning customers ----------------
  // Only fields that are empty (or still hold a value WE filled in) are ever
  // overwritten, so nothing the customer typed themselves gets clobbered, and
  // changing the mobile to a different person doesn't leave the old details behind.
  let orderAutoFilled_ = {};
  let orderLookupTimer_ = null;
  let orderLookedUpMobile_ = '';

  function onOrderMobileInput_() {
    clearTimeout(orderLookupTimer_);
    if (document.getElementById('custMobile').value.trim().length < 10) return;
    orderLookupTimer_ = setTimeout(lookupOrderCustomer_, 350);
  }

  async function lookupOrderCustomer_() {
    clearTimeout(orderLookupTimer_);
    const mobile = document.getElementById('custMobile').value.trim();
    if (mobile.length < 10 || mobile === orderLookedUpMobile_) return;
    orderLookedUpMobile_ = mobile;

    const { data } = await sb.rpc('get_customer_for_order', { p_mobile: mobile });
    if (document.getElementById('custMobile').value.trim() !== mobile) return; // number was changed while loading
    const found = !!(data && data.found);

    const fieldMap = {
      custName: found && data.name, custCity: found && data.city,
      custIdName: found && data.idName, custDsId: found && data.dsId
    };
    Object.keys(fieldMap).forEach(function (id) {
      const el = document.getElementById(id);
      if (!el) return;
      const newVal = fieldMap[id] ? String(fieldMap[id]).toUpperCase() : '';
      const untouched = !el.value.trim() || el.value === orderAutoFilled_[id];
      if (!untouched) return;
      el.value = newVal;
      if (newVal) orderAutoFilled_[id] = newVal; else delete orderAutoFilled_[id];
    });

    const hint = document.getElementById('custLookupHint');
    if (hint) {
      hint.textContent = found ? '✓ Your saved details were filled in — please check them and update anything that has changed.' : '';
      hint.style.display = found ? 'block' : 'none';
    }
  }

  function renderForm() {
    orderAutoFilled_ = {}; orderLookedUpMobile_ = '';
    document.getElementById('mainArea').innerHTML =
      '<div class="card">' +
        '<p class="section-label">Your details</p>' +
        '<div class="field"><label for="custMobile">Mobile</label><input type="tel" id="custMobile" placeholder="10-digit mobile — enter this first" maxlength="15" oninput="onOrderMobileInput_()" onblur="lookupOrderCustomer_()"></div>' +
        '<p id="custLookupHint" style="display:none;margin:-6px 0 12px;font-size:12px;font-weight:600;color:var(--green-700);"></p>' +
        '<div class="field"><label for="custName">Name</label><input type="text" id="custName" placeholder="Your name" oninput="this.value=this.value.toUpperCase()"></div>' +
        '<div class="field"><label for="custCity">City</label><input type="text" id="custCity" placeholder="Your city" oninput="this.value=this.value.toUpperCase()"></div>' +
        '<div class="field" style="margin-bottom:0;"><label for="custType">Customer type</label>' +
          '<select id="custType" onchange="onCustomerTypeChange()" style="width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;">' +
            '<option value="" selected disabled>Choose type…</option><option>Retail</option><option>Distributor</option>' +
          '</select>' +
        '</div>' +
        '<div class="field" id="discountField" style="display:none;margin-top:12px;margin-bottom:0;">' +
          '<label for="discountPercent">Discount % (max 5%)</label>' +
          '<input type="number" id="discountPercent" min="0" max="5" step="0.5" placeholder="0" oninput="capDiscount(); renderCart();">' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<p class="section-label">Distributor / reference details</p>' +
        '<div class="field"><label for="custIdName">ID Name</label><input type="text" id="custIdName" placeholder="Your ID name" oninput="this.value=this.value.toUpperCase()"></div>' +
        '<div class="field"><label for="custDsId">DS ID No.</label><input type="text" id="custDsId" placeholder="Your DS ID number" oninput="this.value=this.value.toUpperCase()"></div>' +
        '<div class="field"><label for="custRefName">Reference / Upline Name</label><input type="text" id="custRefName" placeholder="Who referred you" oninput="this.value=this.value.toUpperCase()"></div>' +
        '<div class="field" style="margin-bottom:0;"><label for="custRefMobile">Reference / Upline Mobile</label><input type="tel" id="custRefMobile" placeholder="10-digit mobile" maxlength="15"></div>' +
      '</div>' +
      '<div class="card">' +
        '<p class="section-label">Search products by code or name</p>' +
        '<div class="search-wrap">' +
          '<input type="text" id="searchInput" class="field" style="width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;" placeholder="e.g. product code…" autocomplete="off" oninput="renderSearchResults(this.value)" onkeydown="searchKeydown(event)">' +
          '<div id="searchResults" class="search-results"></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<p class="section-label" id="cartHeading">Your order (0 items)</p>' +
        '<div id="cartList"><div class="empty-cart">Search above and tap a product to add it.</div></div>' +
        '<div id="discountLine" style="display:none;" class="total-row"><span class="lbl">Discount</span><span class="val" id="cartDiscount" style="font-size:14px;color:var(--danger);">−₹0</span></div>' +
        '<div class="total-row" style="border-top:none;padding-top:0;"><span class="lbl">Total SP</span><span class="val" id="cartSp" style="font-size:15px;color:var(--gold-600);">0 SP</span></div>' +
        '<div class="total-row"><span class="lbl">Total</span><span class="val" id="cartTotal">₹0</span></div>' +
      '</div>' +
      '<button class="btn" style="background:transparent;border:1.5px solid var(--line);color:var(--green-800);margin-bottom:8px;" id="saveNoPayBtn" onclick="createOrder(false)" disabled>Save without Payment</button>' +
      '<button class="btn btn-gold" id="payNowBtn" onclick="createOrder(true)" disabled>Pay Now</button>' +
      '<p class="error-msg" id="formError"></p>';
  }

  function onCustomerTypeChange() {
    const type = document.getElementById('custType').value;
    document.getElementById('discountField').style.display = type === 'Retail' ? 'block' : 'none';
    renderCart();
  }

  function capDiscount() {
    const input = document.getElementById('discountPercent');
    if (Number(input.value) > 5) input.value = 5;
    if (Number(input.value) < 0) input.value = 0;
  }

  function currentPriceField() {
    return document.getElementById('custType') && document.getElementById('custType').value === 'Distributor' ? 'dp' : 'mrp';
  }

  let SEARCH_MATCHES = [];   // products currently listed under the search box
  let SEARCH_ACTIVE = -1;    // the highlighted one (Enter picks it)
  let pendingOrderProduct = null;

  function setSearchActive(idx) {
    SEARCH_ACTIVE = idx;
    Array.from(document.querySelectorAll('#searchResults .search-row')).forEach(function (r, i) { r.classList.toggle('kbd-active', i === idx); });
  }

  function searchKeydown(e) {
    if (!SEARCH_MATCHES.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setSearchActive(Math.min(SEARCH_ACTIVE + 1, SEARCH_MATCHES.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setSearchActive(Math.max(SEARCH_ACTIVE - 1, 0)); }
    else if (e.key === 'Enter') { e.preventDefault(); promptOrderQty(SEARCH_MATCHES[SEARCH_ACTIVE > -1 ? SEARCH_ACTIVE : 0].code); }
  }

  function renderSearchResults(q) {
    const box = document.getElementById('searchResults');
    q = (q || '').trim().toLowerCase();
    SEARCH_MATCHES = []; SEARCH_ACTIVE = -1;
    if (!q) { box.innerHTML = ''; return; }
    const priceField = currentPriceField();
    const matches = ALL_PRODUCTS.filter(function (p) {
      return p.code.toLowerCase().indexOf(q) > -1 || p.name.toLowerCase().indexOf(q) > -1;
    }).slice(0, 20);
    if (!matches.length) { box.innerHTML = '<p class="hint" style="padding:10px 0;">No products found for "' + escapeHtml(q) + '".</p>'; return; }
    box.innerHTML = matches.map(function (p) {
      return '<div class="search-row" data-code="' + escapeHtml(p.code) + '">' +
        '<div><div class="search-name">' + escapeHtml(p.name) + '</div><div class="search-meta">#' + escapeHtml(p.code) + ' · ' + trimNum(p.sp) + ' SP</div></div>' +
        '<div class="search-price">' + money(p[priceField]) + '</div></div>';
    }).join('');
    SEARCH_MATCHES = matches;
    Array.from(box.querySelectorAll('.search-row')).forEach(function (row, idx) {
      row.addEventListener('click', function () { promptOrderQty(row.dataset.code); });
      row.addEventListener('mouseenter', function () { setSearchActive(idx); });
    });
    setSearchActive(0);
  }

  // A product was chosen: ask for the quantity first (same as New Bill), then add it.
  function promptOrderQty(code) {
    const typeEl = document.getElementById('custType');
    if (!typeEl.value) { document.getElementById('formError').textContent = 'Please choose a customer type first.'; return; }
    const p = ALL_PRODUCTS.find(function (x) { return x.code === code; });
    if (!p) return;
    const err = document.getElementById('formError');
    if (err.textContent === 'Please choose a customer type first.') err.textContent = '';
    pendingOrderProduct = p;
    document.getElementById('oqtyName').textContent = p.name;
    document.getElementById('oqtyMeta').textContent = '#' + p.code + ' · ' + trimNum(p.sp) + ' SP · ' + money(p[currentPriceField()]) + ' each';
    const input = document.getElementById('oqtyInput');
    input.value = '1';
    document.getElementById('orderQtyModal').classList.add('show');
    setTimeout(function () { input.focus(); input.select(); }, 60);
  }

  function orderQtyKeydown(e) {
    if (e.key === 'Enter') { e.preventDefault(); confirmOrderQtyModal(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelOrderQtyModal(); }
  }

  function confirmOrderQtyModal() {
    const qty = Math.round(Number(document.getElementById('oqtyInput').value));
    if (!(qty > 0)) { document.getElementById('oqtyInput').focus(); document.getElementById('oqtyInput').select(); return; }
    const p = pendingOrderProduct;
    if (!p) return;
    pendingOrderProduct = null;
    document.getElementById('orderQtyModal').classList.remove('show');
    addToCart(p.code, qty);
    document.getElementById('searchInput').focus();   // straight back to the search box for the next product
  }

  function cancelOrderQtyModal() {
    pendingOrderProduct = null;
    document.getElementById('orderQtyModal').classList.remove('show');
    document.getElementById('searchInput').focus();
  }

  function addToCart(code, qty) {
    qty = qty > 0 ? qty : 1;
    if (!document.getElementById('custType').value) { document.getElementById('formError').textContent = 'Please choose a customer type first.'; return; }
    const p = ALL_PRODUCTS.find(function (x) { return x.code === code; });
    if (!p) return;
    if (CART[code]) CART[code].qty += qty;
    else CART[code] = { code: p.code, name: p.name, mrp: p.mrp, dp: p.dp, sp: p.sp, qty: qty };
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '';
    SEARCH_MATCHES = []; SEARCH_ACTIVE = -1;
    renderCart();
  }

  function changeQty(code, delta) {
    if (!CART[code]) return;
    CART[code].qty += delta;
    if (CART[code].qty <= 0) delete CART[code];
    renderCart();
  }

  function renderCart() {
    const items = Object.values(CART);
    const priceField = currentPriceField();
    const isRetail = document.getElementById('custType') && document.getElementById('custType').value === 'Retail';
    document.getElementById('cartHeading').textContent = 'Your order (' + items.length + (items.length === 1 ? ' item)' : ' items)');
    const box = document.getElementById('cartList');
    if (!items.length) {
      box.innerHTML = '<div class="empty-cart">Search above and tap a product to add it.</div>';
    } else {
      box.innerHTML = items.map(function (it) {
        return '<div class="cart-row"><div><div class="cart-name">' + escapeHtml(it.name) + '</div><div class="cart-price">' + money(it[priceField]) + ' each · ' + trimNum(it.qty * it.sp) + ' SP</div></div>' +
          '<div class="qty-ctrl">' +
            '<button class="qty-btn" onclick="changeQty(\'' + it.code + '\',-1)">−</button>' +
            '<span class="qty-val">' + trimNum(it.qty) + '</span>' +
            '<button class="qty-btn" onclick="changeQty(\'' + it.code + '\',1)">+</button>' +
          '</div></div>';
      }).join('');
    }
    const subtotal = items.reduce(function (s, it) { return s + it.qty * it[priceField]; }, 0);
    const totalSp = items.reduce(function (s, it) { return s + it.qty * it.sp; }, 0);
    let discountAmt = 0;
    let finalTotal = subtotal;
    if (isRetail) {
      let pct = Number(document.getElementById('discountPercent').value) || 0;
      if (pct > 5) pct = 5;
      finalTotal = Math.round(subtotal * (1 - pct / 100));
      discountAmt = subtotal - finalTotal;
    }
    document.getElementById('discountLine').style.display = (isRetail && discountAmt > 0) ? 'flex' : 'none';
    document.getElementById('cartDiscount').textContent = '−' + money(discountAmt);
    document.getElementById('cartSp').textContent = trimNum(totalSp) + ' SP';
    document.getElementById('cartTotal').textContent = money(finalTotal);
    document.getElementById('saveNoPayBtn').disabled = items.length === 0;
    document.getElementById('payNowBtn').disabled = items.length === 0;
  }

  let lastOrderSnapshot = null;

  async function createOrder(wantsToPay) {
    const errBox = document.getElementById('formError');
    errBox.textContent = '';
    const name = document.getElementById('custName').value.trim();
    const mobile = document.getElementById('custMobile').value.trim();
    const city = document.getElementById('custCity').value.trim();
    const custType = document.getElementById('custType').value;
    const idName = document.getElementById('custIdName').value.trim();
    const dsId = document.getElementById('custDsId').value.trim();
    const refName = document.getElementById('custRefName').value.trim();
    const refMobile = document.getElementById('custRefMobile').value.trim();
    if (!name) { errBox.textContent = 'Please enter your name.'; return; }
    if (!mobile || mobile.replace(/\D/g, '').length < 10) { errBox.textContent = 'Please enter a valid 10-digit mobile number.'; return; }
    if (!city) { errBox.textContent = 'Please enter your city.'; return; }
    if (!custType) { errBox.textContent = 'Please choose a customer type.'; return; }
    if (!idName) { errBox.textContent = 'Please enter your ID Name.'; return; }
    if (!dsId) { errBox.textContent = 'Please enter your DS ID No.'; return; }
    if (!refName) { errBox.textContent = 'Please enter your Reference/Upline Name.'; return; }
    if (!refMobile || refMobile.replace(/\D/g, '').length < 10) { errBox.textContent = 'Please enter a valid Reference/Upline Mobile number.'; return; }
    const items = Object.values(CART).map(function (it) { return { code: it.code, qty: it.qty }; });
    if (!items.length) { errBox.textContent = 'Add at least one product first.'; return; }
    let discountPercent = 0;
    if (custType === 'Retail') { discountPercent = Number(document.getElementById('discountPercent').value) || 0; if (discountPercent > 5) discountPercent = 5; }
    const orderDraft = {
      name: name, mobile: mobile, custType: custType, discountPercent: discountPercent, items: items, cartSnapshot: Object.values(CART),
      city: city, idName: idName, dsId: dsId, refName: refName, refMobile: refMobile
    };

    if (wantsToPay) {
      // Don't save anything yet - just show the QR/UTR screen. The request
      // is only staged once the customer confirms payment with a UTR, so
      // someone who backs out here never leaves anything behind at all.
      let previewTotal = 0;
      Object.values(CART).forEach(function (it) { previewTotal += it.qty * (custType === 'Retail' ? it.mrp : it.dp); });
      if (custType === 'Retail' && discountPercent > 0) previewTotal = Math.round(previewTotal * (1 - discountPercent / 100));
      showPaymentQr(previewTotal, orderDraft);
      return;
    }

    document.getElementById('saveNoPayBtn').disabled = true;
    document.getElementById('payNowBtn').disabled = true;
    document.getElementById('saveNoPayBtn').textContent = 'Placing order…';
    const { data, error } = await sb.rpc('save_public_order_request', {
      p_customer_name: name, p_mobile: mobile, p_customer_type: custType, p_discount_percent: discountPercent, p_items: items,
      p_city: city, p_id_name: idName, p_id_no: dsId, p_reference_name: refName, p_reference_mobile: refMobile
    });
    if (error) {
      errBox.textContent = error.message || 'Could not place order. Please try again.';
      document.getElementById('saveNoPayBtn').disabled = false;
      document.getElementById('payNowBtn').disabled = false;
      document.getElementById('saveNoPayBtn').textContent = 'Save without Payment';
      return;
    }
    lastOrderSnapshot = orderDraft;
    lastOrderSnapshot.totalAmount = data.totalAmount;
    lastOrderSnapshot.totalSp = data.totalSp;
    showThankYou(data.orderId, data.totalAmount, false);
  }

  let pendingPaymentOrder = null;
  function showPaymentQr(previewTotal, orderDraft) {
    pendingPaymentOrder = orderDraft;
    const tempRef = 'TMP' + Date.now();
    const upiUrl = 'upi://pay?pa=' + encodeURIComponent(BUSINESS_UPI_ID) + '&pn=' + encodeURIComponent(BUSINESS_PAYEE_NAME) +
      '&am=' + encodeURIComponent(Number(previewTotal).toFixed(2)) + '&cu=INR&tr=' + encodeURIComponent(tempRef) + '&tn=' + encodeURIComponent('Order payment');
    const qrImgUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=' + encodeURIComponent(upiUrl);
    document.getElementById('mainArea').innerHTML =
      '<div class="card" style="text-align:center;">' +
        '<h2 style="font-size:17px;color:var(--green-800);margin-bottom:4px;">Pay now via UPI</h2>' +
        '<p class="hint">' + money(previewTotal) + '</p>' +
        '<div class="qr-box"><img src="' + qrImgUrl + '" alt="UPI QR code"></div>' +
        '<p class="hint"><strong>Recommended:</strong> open your UPI app and scan this QR — the amount (' + money(previewTotal) + ') is already filled in.</p>' +
      '</div>' +
      '<div class="card" style="text-align:center;">' +
        '<a class="btn" style="background:transparent;border:1.5px solid var(--line);color:var(--green-800);" href="' + escapeHtml(upiUrl) + '">Or tap here to open your UPI app</a>' +
        '<p class="hint" style="margin-top:8px;">If this shows an "unable to proceed" error, please use the QR code above instead — that always works.</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="field" style="margin-bottom:0;"><label for="payUtr">Your UPI transaction ref. (UTR) — required</label><input type="text" id="payUtr" placeholder="As shown in your UPI app after payment"></div>' +
        '<p class="error-msg" id="utrError"></p>' +
      '</div>' +
      '<button class="btn btn-gold" style="margin-bottom:8px;" id="confirmPaidBtn" onclick="confirmUpiPaidAndSave()">I\'ve completed the payment</button>' +
      '<button class="btn" style="background:transparent;border:1.5px solid var(--line);color:var(--green-800);" id="payLaterBtn" onclick="saveOrderWithoutPaymentAfterQr()">← I\'ll pay later</button>';
  }

  async function confirmUpiPaidAndSave() {
    const utr = document.getElementById('payUtr').value.trim();
    if (!utr) { document.getElementById('utrError').textContent = 'Please enter your UPI transaction reference (UTR) — it\'s in your UPI app\'s payment history. Your order is only placed once this is confirmed.'; return; }
    if (!pendingPaymentOrder) { document.getElementById('utrError').textContent = 'Something went wrong — please start again.'; return; }
    document.getElementById('confirmPaidBtn').disabled = true;
    document.getElementById('confirmPaidBtn').textContent = 'Confirming…';
    document.getElementById('payLaterBtn').disabled = true;
    const o = pendingPaymentOrder;
    const { data, error } = await sb.rpc('save_public_order_request', { p_customer_name: o.name, p_mobile: o.mobile, p_customer_type: o.custType, p_discount_percent: o.discountPercent, p_items: o.items, p_city: o.city, p_id_name: o.idName, p_id_no: o.dsId, p_reference_name: o.refName, p_reference_mobile: o.refMobile });
    if (error) {
      document.getElementById('utrError').textContent = error.message || 'Could not place order. Please try again.';
      document.getElementById('confirmPaidBtn').disabled = false;
      document.getElementById('confirmPaidBtn').textContent = 'I\'ve completed the payment';
      document.getElementById('payLaterBtn').disabled = false;
      return;
    }
    await sb.rpc('mark_public_order_payment_intent', { p_order_id: data.orderId, p_amount: data.totalAmount, p_utr_no: utr });
    lastOrderSnapshot = o;
    lastOrderSnapshot.totalAmount = data.totalAmount;
    lastOrderSnapshot.totalSp = data.totalSp;
    pendingPaymentOrder = null;
    showThankYou(data.orderId, data.totalAmount, true);
  }

  async function saveOrderWithoutPaymentAfterQr() {
    if (!pendingPaymentOrder) return;
    document.getElementById('payLaterBtn').disabled = true;
    document.getElementById('confirmPaidBtn').disabled = true;
    const o = pendingPaymentOrder;
    const { data, error } = await sb.rpc('save_public_order_request', { p_customer_name: o.name, p_mobile: o.mobile, p_customer_type: o.custType, p_discount_percent: o.discountPercent, p_items: o.items, p_city: o.city, p_id_name: o.idName, p_id_no: o.dsId, p_reference_name: o.refName, p_reference_mobile: o.refMobile });
    if (error) {
      document.getElementById('utrError').textContent = error.message || 'Could not place order. Please try again.';
      document.getElementById('payLaterBtn').disabled = false;
      document.getElementById('confirmPaidBtn').disabled = false;
      return;
    }
    lastOrderSnapshot = o;
    lastOrderSnapshot.totalAmount = data.totalAmount;
    lastOrderSnapshot.totalSp = data.totalSp;
    pendingPaymentOrder = null;
    showThankYou(data.orderId, data.totalAmount, false);
  }

  function showThankYou(orderId, totalAmount, paid) {
    document.getElementById('mainArea').innerHTML =
      '<div class="card" style="text-align:center;">' +
        '<div class="success-icon">✓</div>' +
        '<h2 style="font-size:18px;color:var(--green-800);margin-bottom:4px;">Thank you!</h2>' +
        '<p class="hint">Request No. <strong>' + escapeHtml(String(orderId)) + '</strong> · ' + money(totalAmount) + '</p>' +
        '<p class="hint" style="margin-top:10px;">' + (paid ? 'We\'ve noted your payment — our team will verify and confirm shortly.' : 'Our team will review and confirm your order shortly.') + '</p>' +
      '</div>' +
      '<button class="btn btn-gold" onclick="showFinalReceipt(' + orderId + ')">Continue</button>';
  }

  function showFinalReceipt(orderId) {
    const snap = lastOrderSnapshot;
    if (!snap) {
      document.getElementById('mainArea').innerHTML = '<div class="empty">Request ' + escapeHtml(String(orderId)) + ' saved.</div>' +
        '<button class="btn btn-gold" onclick="goBackToForm()">← Place another order</button>';
      return;
    }
    const dateStr = new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
    const isRetail = snap.custType === 'Retail';
    let totalMrp = 0;
    const rows = snap.cartSnapshot.map(function (it) {
      totalMrp += it.qty * it.mrp;
      const price = isRetail ? it.mrp : it.dp;
      return '<div class="cart-row"><div><div class="cart-name">' + escapeHtml(it.name) + ' × ' + trimNum(it.qty) + '</div><div class="cart-price">' + trimNum(it.qty * it.sp) + ' SP</div></div>' +
        '<div class="cart-price" style="font-weight:700;color:var(--green-800);">' + money(it.qty * price) + '</div></div>';
    }).join('');
    const discountAmount = isRetail ? (totalMrp - snap.totalAmount) : 0;
    document.getElementById('mainArea').innerHTML =
      '<div class="card">' +
        '<h2 style="font-size:17px;color:var(--green-800);text-align:center;margin-bottom:2px;">Mahakal Wellness</h2>' +
        '<p class="hint" style="text-align:center;margin-bottom:14px;">Request No. ' + escapeHtml(String(orderId)) + ' · ' + dateStr + '</p>' +
        '<p class="hint" style="margin-bottom:10px;">' + escapeHtml(snap.name || 'Customer') + ' · ' + escapeHtml(snap.mobile || '') + ' · ' + escapeHtml(snap.custType) + '</p>' +
        rows +
        (discountAmount > 0 ? '<div class="total-row"><span class="lbl">Discount (' + trimNum(snap.discountPercent) + '%)</span><span class="val" style="font-size:14px;color:var(--danger);">−' + money(discountAmount) + '</span></div>' : '') +
        '<div class="total-row" style="border-top:none;padding-top:0;"><span class="lbl">Total SP</span><span class="val" style="font-size:15px;color:var(--gold-600);">' + trimNum(snap.totalSp) + ' SP</span></div>' +
        '<div class="total-row"><span class="lbl">Total</span><span class="val">' + money(snap.totalAmount) + '</span></div>' +
      '</div>' +
      '<p class="hint" style="text-align:center;margin-bottom:14px;">📸 Take a screenshot of this bill to keep or share. This is a request — our team will confirm it shortly.</p>' +
      '<button class="btn btn-gold" onclick="goBackToForm()">← Place another order</button>';
  }

  function goBackToForm() {
    CART = {};
    renderForm();
  }

  init();

  const PUSH_VAPID_PUBLIC_KEY = 'BF8D3xu3flEF0NiA6DEQhOtYSe19SwHnlUBNI4wjgA9-kZn9PeUyfl8iFvMEBwVyJLUhedzyqBQ4xW1g_dCiLFQ';

  function urlBase64ToUint8Array_(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  async function enablePushNotifications_() {
    if (!('Notification' in window) || !('PushManager' in window)) { showToast_('Notifications aren\'t supported on this browser.'); return; }
    if (Notification.permission === 'denied') { showToast_('Notifications are blocked — enable them from your browser\'s site settings.'); return; }
    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') return;
      const reg = await navigator.serviceWorker.ready;
      let subscription = await reg.pushManager.getSubscription();
      if (!subscription) {
        subscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array_(PUSH_VAPID_PUBLIC_KEY)
        });
      }
      const json = subscription.toJSON();
      await sb.rpc('save_push_subscription', { p_endpoint: json.endpoint, p_p256dh_key: json.keys.p256dh, p_auth_key: json.keys.auth });
      renderNotifBell_();
    } catch (err) {}
  }

  function showToast_(msg) {
    const errBox = document.getElementById('notifPanelMsg');
    if (errBox) errBox.textContent = msg;
  }

  function renderNotifBell_() {
    const btn = document.getElementById('notifBellBtn');
    if (!btn) return;
    const supported = ('Notification' in window) && ('PushManager' in window);
    btn.textContent = (supported && Notification.permission === 'granted') ? '🔔' : '🔕';
  }

  function openNotifPanel_() {
    document.getElementById('notifPanel').style.display = 'flex';
    document.getElementById('notifPanelMsg').textContent = '';
    const supported = ('Notification' in window) && ('PushManager' in window);
    document.getElementById('notifEnableRow').style.display = (supported && Notification.permission !== 'granted') ? 'block' : 'none';
    loadNotifHistory_();
  }

  function closeNotifPanel_() {
    document.getElementById('notifPanel').style.display = 'none';
  }

  async function loadNotifHistory_() {
    const box = document.getElementById('notifList');
    box.innerHTML = '<div class="empty">Loading…</div>';
    const { data, error } = await sb.rpc('get_recent_notifications', { p_limit: 20 });
    if (error) { box.innerHTML = '<div class="empty">Could not load notifications.</div>'; return; }
    const rows = data || [];
    if (!rows.length) { box.innerHTML = '<div class="empty">No notifications yet.</div>'; return; }
    box.innerHTML = rows.map(function (r) {
      const dateStr = new Date(r.sent_at).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
      return '<div class="card" style="margin-bottom:8px;">' +
        '<div style="font-weight:700;color:var(--green-800);font-size:14px;">' + escapeHtml(r.title) + '</div>' +
        '<div style="font-size:13px;color:#333;margin:4px 0;">' + escapeHtml(r.body) + '</div>' +
        '<div class="hint">' + dateStr + '</div></div>';
    }).join('');
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function () { renderNotifBell_(); }).catch(function () {});
    });
  }
</script>
