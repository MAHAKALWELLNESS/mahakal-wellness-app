<title>No connection · Mahakal Wellness</title>
<style>
  /* This page is shown by the app itself when a page cannot be loaded (no internet, or the server is not answering).
     It must work with NO internet: everything is inside this one file - no pictures, fonts or scripts from outside. */
  :root { --green-900:#132E26; --green-800:#1E4A3D; --cream:#F6F5F1; --ink:#1d2b26; --muted:#5b6a63; --line:#e1ded4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--cream); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  header { background: var(--green-900); color: #fff; padding: 16px 18px; font-weight: 700; font-size: 17px; letter-spacing: .2px; }
  main { max-width: 460px; margin: 0 auto; padding: 36px 20px 32px; text-align: center; }
  .ico { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%; background: #fff; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 10px; color: var(--green-900); }
  p { font-size: 16px; line-height: 1.5; margin: 0 0 10px; }
  .hi { color: var(--muted); font-size: 15px; }
  .btn { display: block; width: 100%; min-height: 48px; margin: 14px 0 0; padding: 13px 16px; border-radius: 12px; border: 0;
    font: inherit; font-weight: 700; font-size: 16px; text-decoration: none; cursor: pointer; }
  .btn.main { background: var(--green-900); color: #fff; box-shadow: 0 3px 0 #0b1c17; }
  .btn.main:active { transform: translateY(2px); box-shadow: 0 1px 0 #0b1c17; }
  .btn.ghost { background: #fff; color: var(--green-900); border: 1.5px solid var(--green-900); }
  .small { margin-top: 26px; font-size: 13px; color: var(--muted); }
</style>
