<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --green-900:#132E26; --green-800:#1E4A3D; --green-100:#DCE9E3;
    --gold-500:#D9A441; --gold-600:#B8842C;
    --surface:#FFFFFF; --bg:#F6F5F1; --ink-soft:#555; --ink-faint:#8A8A8A; --line:#E7E4DC; --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; font-family:'Inter',sans-serif; background:var(--bg); color:#222; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
  h1{font-family:'Fraunces',serif; margin:0;}
  .brand{text-align:center; margin-bottom:36px;}
  .brand h1{font-size:24px; color:var(--green-900);}
  .brand p{margin:4px 0 0; font-size:13px; color:var(--ink-faint); letter-spacing:.3px;}
  .choices{width:100%; max-width:400px; display:flex; flex-direction:column; gap:16px;}
  .choice-card{display:block; width:100%; text-align:left; background:var(--surface); border-radius:18px; padding:26px 22px; text-decoration:none; box-shadow:0 1px 4px rgba(0,0,0,.07); border:1.5px solid var(--line); transition:transform .15s; font-family:inherit; cursor:pointer;}
  .choice-card:active{transform:scale(.98);}
  .choice-icon{font-size:28px; margin-bottom:10px;}
  .choice-title{font-size:17px; font-weight:700; color:var(--green-900); margin-bottom:4px;}
  .choice-desc{font-size:13px; color:var(--ink-soft); line-height:1.4;}
  .choice-card.primary{background:var(--green-900); border-color:var(--green-900);}
  .choice-card.primary .choice-title{color:#fff;}
  .choice-card.primary .choice-desc{color:var(--green-100);}
  .footer-note{margin-top:32px; font-size:11.5px; color:var(--ink-faint); text-align:center;}
  .code-gate{background:var(--surface); border-radius:18px; padding:24px 22px; box-shadow:0 1px 4px rgba(0,0,0,.07); border:1.5px solid var(--line); width:100%;}
  .code-gate label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .code-gate input{width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; font-family:inherit; margin-bottom:8px;}
  .code-gate input:focus{outline:none; border-color:var(--gold-500);}
  .code-gate .err{font-size:12.5px; color:var(--danger); min-height:16px; margin:0 0 10px;}
  .code-gate .btn-row{display:flex; gap:8px;}
  .code-gate button{flex:1; padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer;}
  .code-gate .btn-go{background:var(--gold-500); color:var(--green-900);}
  .code-gate .btn-cancel{background:var(--bg); color:var(--ink-soft); border:1.5px solid var(--line);}
</style>
<style id="mwTiles3d">
/* ===================== WELCOME + MAIN PAGE: colourful 3D boxes (remove this whole <style id="mwTiles3d"> block and the old page is back) ===================== */
body{background:linear-gradient(165deg,#E4EAFF 0%,#F3E8FF 42%,#FFEBDD 100%) fixed; color:#1F2347;}
body::before{content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(circle at 10% 8%, rgba(255,141,179,.42), transparent 230px), radial-gradient(circle at 94% 16%, rgba(124,108,255,.34), transparent 250px),
             radial-gradient(circle at 6% 80%, rgba(54,197,219,.32), transparent 260px), radial-gradient(circle at 98% 92%, rgba(255,174,87,.38), transparent 240px);}

/* ---------- brand ---------- */
.brand{margin-bottom:30px;}
.brand h1{font-size:31px; font-weight:700; color:#3D2FB5;}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .brand h1{background:linear-gradient(90deg,#3D2FB5 0%,#D6336C 55%,#F77F00 100%); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; filter:drop-shadow(0 3px 2px rgba(61,47,181,.2));}
}
#mainBrand p, .brand > p:not(.x){display:inline-block; margin-top:10px; padding:5px 18px; border-radius:20px; background:linear-gradient(180deg,#FFD66B,#FFA62B); color:#4A2B00; font-size:12px; font-weight:800; letter-spacing:.32em; text-indent:.32em;
  box-shadow:0 4px 0 #C97A00, 0 9px 14px rgba(255,166,43,.42), inset 0 2px 0 rgba(255,255,255,.55);}
#installWelcome .brand p{display:block; background:none; box-shadow:none; padding:0; letter-spacing:.3px; text-indent:0; color:#6A5FD0; font-size:14px; font-weight:700; margin-top:6px;}
#mainBrandLogoImg, #welcomeLogoImg{box-shadow:0 0 0 4px #fff, 0 0 0 8px #FF8DB3, 0 14px 26px rgba(61,47,181,.38) !important; animation:mwFloat 3.2s ease-in-out infinite;}
@keyframes mwFloat{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}

/* ---------- the big colourful 3D boxes ---------- */
#mainChoices{gap:26px 16px;}
#mainChoices .choice-card{--t1:#8B7BFF; --t2:#5B3FE0; --t3:#3A2BB0;
  display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start; position:relative; overflow:hidden; border:none; border-radius:26px; padding:18px 16px 16px; min-height:132px; color:#fff; text-align:left;
  background:linear-gradient(160deg,var(--t1),var(--t2)) !important; box-shadow:0 9px 0 var(--t3), 0 20px 28px rgba(40,30,110,.3), inset 0 3px 0 rgba(255,255,255,.5), inset 0 -5px 0 rgba(0,0,0,.08);
  transition:transform .12s ease, box-shadow .12s ease;}
#mainChoices .choice-card::before{content:''; position:absolute; right:-26px; top:-26px; width:104px; height:104px; border-radius:50%; background:rgba(255,255,255,.2); pointer-events:none;}
#mainChoices .choice-card::after{content:''; position:absolute; left:-30%; top:-60%; width:90%; height:110%; background:linear-gradient(115deg,rgba(255,255,255,.38),rgba(255,255,255,0) 60%); transform:rotate(10deg); pointer-events:none;}
#mainChoices .choice-icon{position:relative; z-index:1; width:54px; height:54px; margin:0 0 12px; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:30px; line-height:1;
  background:rgba(255,255,255,.28); box-shadow:inset 0 2px 0 rgba(255,255,255,.6), 0 4px 0 rgba(0,0,0,.14);}
#mainChoices .choice-title{position:relative; z-index:1; color:#fff !important; font-size:17px; font-weight:800; margin-bottom:0; text-shadow:0 2px 3px rgba(0,0,0,.3);}
#mainChoices .choice-desc{position:relative; z-index:1; color:rgba(255,255,255,.94) !important; margin-top:4px; text-shadow:0 1px 2px rgba(0,0,0,.25);}
#mainChoices .choice-card:active{transform:translateY(8px); box-shadow:0 1px 0 var(--t3), 0 6px 10px rgba(40,30,110,.25), inset 0 3px 0 rgba(255,255,255,.4);}
#mainChoices .bento-featured{flex-direction:row; align-items:center; justify-content:flex-start; gap:16px; min-height:104px;}
#mainChoices .bento-featured .choice-icon{margin:0; width:62px; height:62px; font-size:34px; flex:none;}
#mainChoices .bento-featured .choice-title{font-size:20px;}
#mainChoices #installAppBtn[style*="block"]{display:flex !important;}      /* the page script shows this box with display:block - keep its icon-and-title row */
#mainChoices .choice-card.bento-purchase{--t1:#3DDC84; --t2:#0FA35A; --t3:#0A7A41;}
#mainChoices #installAppBtn{--t1:#5B9CFF; --t2:#2F6FED; --t3:#1B49B0;}
#mainChoices .choice-card.bento-hall{--t1:#FFB04D; --t2:#F57C00; --t3:#B35A00;}
#mainChoices .choice-card.bento-rate{--t1:#FFE066; --t2:#FFB300; --t3:#B77E00;}
#mainChoices .choice-card.bento-rate .choice-title{color:#4A2B00 !important; text-shadow:0 1px 0 rgba(255,255,255,.5);}
#mainChoices .choice-card.bento-contact{--t1:#4DD6E8; --t2:#0E9FB5; --t3:#0A6F80;}
#mainChoices .choice-card.bento-halladmin{--t1:#B79BFF; --t2:#7048E8; --t3:#4D2FA8;}
#mainChoices .choice-card.bento-mahakaladmin{--t1:#FF7FB0; --t2:#D6336C; --t3:#962350;}
/* the welcome page (two boxes): green for buying, pink for the admin door */
#mainChoices .choice-card.primary:not([class*="bento"]){--t1:#3DDC84; --t2:#0FA35A; --t3:#0A7A41;}
#mainChoices .choice-card:not(.primary):not([class*="bento"]){--t1:#FF7FB0; --t2:#D6336C; --t3:#962350;}

/* ---------- other buttons and cards ---------- */
.choice-card.primary{background:linear-gradient(180deg,#8B7BFF,#5B3FE0); border:none; color:#fff; border-radius:18px; text-shadow:0 1px 2px rgba(0,0,0,.25);
  box-shadow:0 5px 0 #3A2BB0, 0 10px 18px rgba(91,63,224,.38), inset 0 2px 0 rgba(255,255,255,.38);}
.choice-card.primary:active{transform:translateY(4px); box-shadow:0 1px 0 #3A2BB0, 0 3px 8px rgba(91,63,224,.3);}
.code-gate, #contactUs .choice-card:not(.primary){border:none; border-radius:26px; background:linear-gradient(180deg,#fff,#FAF8FF); box-shadow:inset 0 6px 0 #7C6CFF, 0 8px 0 rgba(150,140,230,.28), 0 18px 28px rgba(82,64,230,.16);}
#contactUs{gap:22px;}
.code-gate{padding-top:26px;}
.code-gate label{color:#4B3FD0; font-weight:800;}
.code-gate input, .qform-input{border:2px solid #DAD6FF; border-radius:14px; background:#FBFAFF; transition:border-color .15s, box-shadow .15s;}
.code-gate input:focus, .qform-input:focus{border-color:#7C6CFF; box-shadow:0 0 0 4px rgba(124,108,255,.2); background:#fff;}
.code-gate button{border-radius:16px; font-weight:800; transition:transform .1s ease, box-shadow .1s ease;}
.code-gate .btn-go{background:linear-gradient(180deg,#3DDC84,#0FA35A); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25); box-shadow:0 5px 0 #0A7A41, 0 10px 16px rgba(15,163,90,.35), inset 0 2px 0 rgba(255,255,255,.4);}
.code-gate .btn-cancel{background:#fff; border:2px solid #C9C3FF; color:#4B3FD0; box-shadow:0 4px 0 #D6D1FF;}
.code-gate button:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.18);}
.back-link{align-self:flex-start; background:#fff; border-radius:16px; padding:8px 14px; color:#4B3FD0; box-shadow:0 3px 0 #D6D1FF, 0 7px 12px rgba(82,64,230,.1); margin-bottom:18px;}
.contact-row{border-bottom:1px dashed #DAD6FF;}
.contact-icon{width:42px; height:42px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; background:#EDE9FF; box-shadow:inset 0 2px 0 rgba(255,255,255,.7), 0 3px 0 rgba(0,0,0,.08);}
a.contact-row:nth-of-type(1) .contact-icon{background:#D8F7EC;} a.contact-row:nth-of-type(2) .contact-icon{background:#DDEEFF;} div.contact-row .contact-icon{background:#FFE9D6;}
.contact-label{color:#7B82A8; font-weight:700;} .contact-value{color:#2B1F8F;}
.map-frame{border-radius:16px; box-shadow:0 0 0 3px #fff, 0 6px 0 rgba(150,140,230,.3);}
#notifBellBtn{background:linear-gradient(180deg,#FFD66B,#FFA62B) !important; border:none !important; color:#4A2B00 !important; box-shadow:0 4px 0 #C97A00, 0 8px 14px rgba(255,166,43,.45) !important;}
#notifBellBtn:active{transform:translateY(3px); box-shadow:0 1px 0 #C97A00 !important;}
#notifPanel > div, #notifDetailPopup > div{border-radius:28px 28px 0 0 !important; box-shadow:0 -12px 40px rgba(36,27,110,.4), inset 0 6px 0 #7C6CFF; background:linear-gradient(180deg,#fff,#F8F6FF) !important;}
#notifDetailPopup > div{border-radius:26px !important;}
.footer-note{color:#7B82A8; font-weight:600;}
@media (prefers-reduced-motion:reduce){ #mainBrandLogoImg, #welcomeLogoImg{animation:none;} #mainChoices .choice-card, .code-gate button{transition:none;} }
</style>
</head>
<body>
  <div class="brand">
    <h1>Mahakal Wellness</h1>
    <p>WELCOME</p>
  </div>
  <div class="choices" id="mainChoices">
    <a class="choice-card primary" href="order.html">
      <div class="choice-icon">🛒</div>
      <div class="choice-title">Purchase Product</div>
      <div class="choice-desc">Browse products and place your order directly.</div>
    </a>
    <button class="choice-card" onclick="showCodeGate()">
      <div class="choice-icon">🔒</div>
      <div class="choice-title">Admin Login</div>
      <div class="choice-desc">For Mahakal Wellness staff — billing counter access.</div>
    </button>
  </div>
  <div class="code-gate" id="codeGate" style="display:none;">
    <label for="adminCodeInput">Enter Admin Link Code</label>
    <input type="password" id="adminCodeInput" placeholder="Code" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();verifyAdminCode();}">
    <p class="err" id="adminCodeError"></p>
    <div class="btn-row">
      <button class="btn-cancel" onclick="hideCodeGate()">Cancel</button>
      <button class="btn-go" onclick="verifyAdminCode()">Continue</button>
    </div>
  </div>
  <p class="footer-note">© Mahakal Wellness</p>

<script>
  const SUPABASE_URL = 'https://lrrqdmmugvizkbjfwneb.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_3zfx8Ne9j2cX7-UmwjY4yg_FRE2xxrP';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showCodeGate() {
    document.getElementById('mainChoices').style.display = 'none';
    document.getElementById('codeGate').style.display = 'block';
    document.getElementById('adminCodeInput').value = '';
    document.getElementById('adminCodeError').textContent = '';
    setTimeout(function () { document.getElementById('adminCodeInput').focus(); }, 60);
  }

  function hideCodeGate() {
    document.getElementById('codeGate').style.display = 'none';
    document.getElementById('mainChoices').style.display = 'flex';
  }

  async function verifyAdminCode() {
    const code = document.getElementById('adminCodeInput').value.trim();
    const errEl = document.getElementById('adminCodeError');
    errEl.textContent = '';
    if (!code) { errEl.textContent = 'Enter the code.'; return; }
    const { data: ok, error } = await sb.rpc('verify_admin_link_code', { p_code: code });
    if (error) { errEl.textContent = 'Could not verify right now — try again.'; return; }
    if (!ok) { errEl.textContent = 'Incorrect code.'; return; }
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
