<style>
  :root{
    --green-900:#132E26; --green-800:#1E4A3D; --green-700:#2A5C4C; --green-100:#DCE9E3;
    --gold-500:#D9A441; --gold-600:#B8842C; --gold-100:#F7E9C7;
    --surface:#FFFFFF; --bg:#F6F5F1; --ink-soft:#555; --ink-faint:#8A8A8A; --line:#E7E4DC;
    --danger:#C0392B; --danger-100:#FBE7E4; --ok:#2E7D4F; --ok-100:#E3F1E8;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:#222; -webkit-font-smoothing:antialiased;}
  h1,h2{font-family:'Fraunces',serif; margin:0;}
  .topbar{background:var(--green-900); padding:14px 16px; text-align:center;}
  .topbar h1{font-size:17px; font-weight:600; color:#fff;}
  .topbar p{margin:2px 0 0; font-size:11.5px; color:var(--green-100); opacity:.85;}
  main{max-width:520px; margin:0 auto; padding:16px;}
  .card{background:var(--surface); border-radius:16px; padding:20px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .badge{display:inline-block; padding:3px 11px; border-radius:20px; font-size:12px; font-weight:700; margin:3px 6px 3px 0;}
  .badge-paid{background:var(--ok-100); color:var(--ok);}
  .badge-partial{background:var(--gold-100); color:var(--gold-600);}
  .badge-unpaid{background:var(--danger-100); color:var(--danger);}
  .live-tag{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--ok); text-transform:uppercase; letter-spacing:.4px; margin-bottom:10px;}
  .live-dot{width:7px; height:7px; border-radius:50%; background:var(--ok); animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.3;}100%{opacity:1;}}
  .receipt-head{text-align:center; margin-bottom:14px;}
  .receipt-head h2{font-size:19px; color:var(--green-800);}
  .receipt-head p{margin:2px 0; font-size:12.5px; color:var(--ink-soft);}
  .receipt-meta{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); margin:12px 0; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); padding:10px 0;}
  table.receipt-table{width:100%; border-collapse:collapse; font-size:13px; margin-bottom:10px;}
  table.receipt-table th{text-align:left; font-size:11px; text-transform:uppercase; color:var(--ink-faint); padding:0 8px 6px 0; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.receipt-table td{padding:7px 8px 7px 0; border-bottom:1px solid var(--line);}
  table.receipt-table td.num, table.receipt-table th.num{text-align:right; padding-right:0;}
  table.receipt-table th:first-child, table.receipt-table td:first-child{padding-left:0;}
  .receipt-total-row{display:flex; justify-content:space-between; padding:6px 0; font-size:13.5px;}
  .receipt-total-row.grand{font-weight:700; font-size:16.5px; color:var(--green-800); border-top:1px solid var(--line); margin-top:4px; padding-top:10px;}
  .hint{font-size:12.5px; color:var(--ink-faint);}
  .empty{padding:40px 20px; text-align:center; color:var(--ink-faint);}
</style>

GxsYAahVQTsw6nqbNjYwH//Z';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function money(n) { return '₹' + (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
  function trimNum(n) { n = Math.round((Number(n) || 0) * 100) / 100; return n.toLocaleString('en-IN'); }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function numberToWordsIndian(num) {
    num = Math.round(Number(num) || 0);
    if (num <= 0) return 'Zero Rupees Only';
    const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
      'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    function twoDigits(n) { return n < 20 ? ones[n] : (tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '')).trim(); }
    function threeDigits(n) { return n < 100 ? twoDigits(n) : (ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + twoDigits(n % 100) : '')).trim(); }
    let n = num;
    const crore = Math.floor(n / 10000000); n %= 10000000;
    const lakh = Math.floor(n / 100000); n %= 100000;
    const thousand = Math.floor(n / 1000); n %= 1000;
    const hundred = n;
    let words = '';
    if (crore) words += threeDigits(crore) + ' Crore ';
    if (lakh) words += threeDigits(lakh) + ' Lakh ';
    if (thousand) words += threeDigits(thousand) + ' Thousand ';
    if (hundred) words += threeDigits(hundred);
    return words.trim() + ' Rupees Only';
  }

  async function loadBill() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const showAdvance = params.get('showAdvance') === '1';
    const main = document.getElementById('mainArea');
    if (!token) { main.innerHTML = '<div class="empty">No bill specified.</div>'; return; }

    const { data, error } = await sb.rpc('get_public_bill_status', { p_share_token: token });
    if (error || !data || !data.found) {
      main.innerHTML = '<div class="empty">Bill not found. Please check the link.</div>';
      return;
    }

    const s = data.settings || {};
    const isPending = data.billStatus === 'Pending';
    const paidSoFar = Number(data.cash || 0) + Number(data.online || 0);
    const payCls = data.balance >= -0.005 ? 'badge-paid' : (paidSoFar > 0.005 ? 'badge-partial' : 'badge-unpaid');
    const payLabel = data.balance >= -0.005 ? 'Paid' : (paidSoFar > 0.005 ? 'Partially Paid' : 'Unpaid');
    const delCls = data.deliveryStatus === 'Partial' ? 'badge-partial' : 'badge-paid';
    const delLabel = data.deliveryStatus === 'Partial' ? 'Delivery Pending' : 'Fully Delivered';
    const dateStr = new Date(data.date).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });

    const isRetail = data.customerType === 'Retail';
    const rows = (data.items || []).map(function (it) {
      const sp = Number(it.sp) || 0;
      const pending = Number(it.pendingQty) || 0;
      const rate = isRetail ? Number(it.mrp) || 0 : Number(it.dp) || 0;
      const amount = isRetail ? it.qty * rate : it.amount;
      return '<tr><td>' + escapeHtml(it.name) + (!isPending && pending > 0.0001 ? ' <span class="badge badge-partial" style="margin-left:4px;">P ' + trimNum(pending) + '</span>' : '') + '</td><td class="num">' + trimNum(it.qty) + '</td>' +
        '<td class="num">' + money(rate) + '</td><td class="num">' + money(amount) + '</td>' +
        '<td class="num">' + trimNum(it.qty * sp) + '</td></tr>';
    }).join('');

    const idLine = (data.idName || data.idNo || data.referenceName || data.referenceMobile) ?
      '<div style="background:var(--gold-100);border:1.5px solid var(--gold-500);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:12.5px;font-weight:700;color:var(--green-900);">' +
        (data.idName ? 'ID Name: ' + escapeHtml(data.idName) + '&nbsp;&nbsp; ' : '') +
        (data.idNo ? 'ID No: ' + escapeHtml(data.idNo) + '&nbsp;&nbsp; ' : '') +
        (data.referenceName || data.referenceMobile ? 'Reference/Upline: ' + escapeHtml(data.referenceName || '') +
          (data.referenceMobile ? ' (' + escapeHtml(String(data.referenceMobile)) + ')' : '') : '') +
      '</div>' : '';

    main.innerHTML =
      '<div class="card">' +
        '<div class="live-tag"><span class="live-dot"></span>Live status — updates automatically</div>' +
        (isPending
          ? '<div><span class="badge badge-partial">On Hold — Awaiting Approval</span></div>'
          : '<div><span class="badge ' + payCls + '">' + payLabel + (data.balance < -0.005 ? ' — Due ' + money(-data.balance) : '') + '</span>' +
            '<span class="badge ' + delCls + '">' + delLabel + '</span></div>') +
      '</div>' +
      '<div class="card">' +
        '<p style="font-size:10.5px;color:var(--ink-faint);margin:0 0 4px;">' + (s['FSSAI No'] ? 'FSSAI: ' + escapeHtml(s['FSSAI No']) : '') + '</p>' +
        '<div class="receipt-head"><img src="' + LOGO_DATA_URI + '" alt="Logo" style="width:64px;height:64px;border-radius:50%;margin-bottom:6px;box-shadow:0 0 0 2px var(--gold-500);">' +
        '<h2 style="margin-bottom:2px;">' + escapeHtml(s['Company Name'] || 'Mahakal Wellness') + '</h2>' +
        '<p style="font-size:10.5px;font-weight:700;color:var(--gold-600);letter-spacing:.3px;margin:0 0 4px;">AUTH. C&amp;F OF ASCLEPIUS WELLNESS PVT LTD</p>' +
        '<p>' + escapeHtml(s['Address'] || '') + '</p><p>' + escapeHtml(s['Mobile'] || '') + (s['Mobile 2'] ? ' / ' + escapeHtml(s['Mobile 2']) : '') + '</p></div>' +
        '<div class="receipt-meta"><span>Bill No: <strong>' + data.invoiceNo + '</strong></span><span>' + dateStr + '</span></div>' +
        (data.customerName || data.mobile ? '<p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 4px;">' +
          escapeHtml(data.customerName || 'Customer') + (data.mobile ? ' · ' + escapeHtml(data.mobile) : '') + '</p>' : '') +
        (data.customerType ? '<p style="font-size:11px;font-weight:700;color:var(--green-800);text-transform:uppercase;margin:0 0 10px;">Customer Type: ' + escapeHtml(data.customerType) + '</p>' : '') +
        idLine +
        '<table class="receipt-table"><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">' + (isRetail ? 'MRP' : 'Rate') + '</th><th class="num">Amount</th><th class="num">SP</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>' +
        '<div class="receipt-total-row"><span>Qty</span><span>' + trimNum(data.totalQty) + '</span></div>' +
        (isRetail ? '<div class="receipt-total-row"><span>Total MRP</span><span>' + money(data.totalMrp) + '</span></div>' +
          '<div class="receipt-total-row"><span>Discount (' + trimNum(data.discountPercent) + '%)</span><span>' + money(data.discountAmount) + '</span></div>' +
          '<div class="receipt-total-row"><span>Net Amount</span><span>' + money(data.netAmount) + '</span></div>'
          : '<div class="receipt-total-row"><span>Total</span><span>' + money(data.totalDP) + '</span></div>') +
        (Number(data.transportCharges) > 0.005 ? '<div class="receipt-total-row"><span>Transport/Bus Charges</span><span>' + money(data.transportCharges) + '</span></div>' : '') +
        '<div class="receipt-total-row grand"><span>Grand Total</span><span>' + money((isRetail ? data.netAmount : data.totalDP) + (Number(data.transportCharges) || 0)) + '</span></div>' +
        '<div class="receipt-total-row"><span>Total SP</span><span>' + trimNum(data.totalSP) + '</span></div>' +
        (isPending ? '' :
          '<div class="receipt-total-row"><span>Cash</span><span>' + money(data.cash) + '</span></div>' +
          '<div class="receipt-total-row"><span>Online</span><span>' + money(data.online) + '</span></div>' +
          '<div class="receipt-total-row"><span>Balance</span><span>' + (data.balance < -0.005 ? 'Due ' + money(-data.balance) : 'Settled') + '</span></div>' +
          (showAdvance && data.balance > 0.005 ? '<div class="receipt-total-row"><span>Advance Payment</span><span>' + money(data.balance) + '</span></div>' : '')) +
        '<p style="font-size:11px;color:var(--ink-soft);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;">Rs. (in words): ' + numberToWordsIndian((isRetail ? data.netAmount : data.totalDP) + (Number(data.transportCharges) || 0)) + '</p>' +
        (data.salesman ? '<p style="font-size:11.5px;color:var(--ink-faint);margin-top:6px;">Billed by ' + escapeHtml(data.salesman) + '</p>' : '') +
        '<div style="font-size:10.5px;color:var(--ink-faint);margin-top:14px;line-height:1.7;">' +
          '<p style="margin:2px 0;">भूल-चूक लेनी-देनी।</p>' +
          '<p style="margin:2px 0;">बिका हुआ सामान वापस नहीं होगा और न ही बदली होगी।</p>' +
          '<p style="margin:2px 0;">यह बिल बिलिंग दिनांक से 7 दिनों तक वैध है उसके बाद SP की कोई जवाबदेही नहीं होगी।</p>' +
          '<p style="margin:2px 0;">प्रोडक्ट को अच्छे से काउंट करके लेवे, जाने के बाद कोई जवाबदेही नहीं होगी।</p>' +
          '<p style="margin:2px 0;">थैला या कैरी बैग का अलग से चार्ज लगेगा।</p>' +
        '</div>' +
        '<p style="text-align:center;font-size:12px;color:var(--ink-faint);margin-top:14px;">Thank you for shopping with us!</p>' +
      '</div>' +
      '<p class="hint" style="text-align:center;">Bookmark this page — it always shows your bill\'s latest status.</p>';
  }

  loadBill();
</script>
